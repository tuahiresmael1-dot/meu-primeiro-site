<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Detector de Links Tuahir</title>
    
    <!-- CSS -->
    <style>
        body { 
            background: #0f172a; 
            color: white; 
            text-align: center; 
            padding: 50px; 
            font-family: Arial, sans-serif;
        }
        h1 { color: #22c55e; }
        input { 
            padding: 12px; 
            width: 350px; 
            border-radius: 8px; 
            border: none; 
            font-size: 16px;
        }
        button { 
            padding: 12px 20px; 
            background: #22c55e; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px;
            margin-left: 10px;
        }
        button:hover { background: #16a34a; }
    </style>

    <!-- CODIGO DO ADSENSE -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3911893827916159" crossorigin="anonymous"></script>
</head>
<body>

    <h1>🔍 Detector de Links Tuahir</h1>
    <p>Cole qualquer link e verifique se é seguro</p>
    
    <!-- HTML: CAMPO E BOTÃO -->
    <input type="text" id="linkInput" placeholder="Ex: www.google.com ou link.com">
    <button onclick="analisarLinks()">Verificar Link</button>
    
    <div id="resultado"></div>

    <!-- JAVASCRIPT: COLE AQUI -->
    <script>
    function analisarLinks() {
        let urlInput = document.getElementById("linkInput").value.trim();
        const resultadoDiv = document.getElementById("resultado");

        if (urlInput === "") {
            resultadoDiv.innerHTML = "<p style='color: #ffa500; font-weight:bold;'>⚠️ Por favor, insira um link para verificar.</p>";
            return;
        }

        // NOVO: Se não tiver http, adiciona https:// sozinho
        // Agora aceita: google.com, www.google.com, link.com
        if (!urlInput.startsWith("http://") && !urlInput.startsWith("https://")) {
            urlInput = "https://" + urlInput;
        }

        // Lista de termos suspeitos
        const termosPerigosos = [
            "ganhar-dinheiro", "premio", "sorteio", "gratis", "vaga-urgente", 
            "atualizar-senha", "free-robux", "bit.ly", "promocao", "login", 
            "verificar", "senha", "banco", "pix", "urgente", "conta", "recuperar"
        ];

        // Verifica se tem termo suspeito
        const éPerigoso = termosPerigosos.some(termo => urlInput.toLowerCase().includes(termo));

        // Mostra resultado
        if (éPerigoso) {
            resultadoDiv.innerHTML = `
                <div style="background-color: #ffdddd; color: #d8000c; padding: 15px; border-radius: 10px; margin-top: 20px; font-weight: bold; border: 2px solid #d8000c;">
                    ⚠️ LINK PERIGOSO DETECTADO!<br>
                    <span style="font-size: 14px; font-weight: normal;">Este link contém padrões comuns de golpes. Não clique!</span>
                </div>
            `;
        } else {
            resultadoDiv.innerHTML = `
                <div style="background-color: #ddffdd; color: #4f8a10; padding: 15px; border-radius: 10px; margin-top: 20px; font-weight: bold; border: 2px solid #4f8a10;">
                    ✅ LINK SEGURO!<br>
                    <span style="font-size: 14px; font-weight: normal;">Nenhuma ameaça óbvia foi encontrada em: ${urlInput}</span>
                </div>
            `;
        }
    }
    </script>

</body>
</html>
