<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Links Tuahir | Segurança Online</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white; 
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        h1 { 
            font-size: 2.5rem;
            font-weight: 700;
            color: #22c55e; 
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 40px;
        }

        .box {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input { 
            flex: 1;
            padding: 18px 20px; 
            border-radius: 12px; 
            border: 2px solid #334155; 
            background: #0f172a;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #22c55e; }

        button { 
            padding: 18px 30px; 
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 1rem;
            font-weight: 600;
            transition: 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(34,197,94,0.4); }

        .resultado-box {
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            font-weight: 600;
            font-size: 1.1rem;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .seguro { background: #dcfce7; color: #166534; border: 2px solid #22c55e; }
        .perigoso { background: #fee2e2; color: #991b1b; border: 2px solid #ef4444; }
        .aviso { background: #ffedd5; color: #9a3412; border: 2px solid #f97316; }

        footer {
            margin-top: 50px;
            color: #64748b;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .box { padding: 25px; }
            .input-group { flex-direction: column; }
            button { width: 100%; }
        }
    </style>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3911893827916159" crossorigin="anonymous"></script>
</head>
<body>

    <div class="container">
        <h1>🔍 Detector de Links Tuahir</h1>
        <p class="subtitle">Verifique se um link é seguro antes de clicar. Proteja-se contra golpes e phishing.</p>
        
        <div class="box">
            <div class="input-group">
                <input type="text" id="linkInput" placeholder="Cole o link aqui: www.google.com">
                <button onclick="analisarLinks()">Verificar Link</button>
            </div>
            <div id="resultado"></div>
        </div>

        <footer>
            Feito para sua segurança online © 2026
        </footer>
    </div>

    <script>
    function analisarLinks() {
        let urlInput = document.getElementById("linkInput").value.trim();
        const resultadoDiv = document.getElementById("resultado");

        if (urlInput === "") {
            resultadoDiv.innerHTML = `<div class="resultado-box aviso">⚠️ Por favor, insira um link para verificar.</div>`;
            return;
        }

        if (!urlInput.startsWith("http://") && !urlInput.startsWith("https://")) {
            urlInput = "https://" + urlInput;
        }

        const urlLower = urlInput.toLowerCase();

        // 1. DETECTAR DOMÍNIOS FALSOS - PHISHING
        const dominiosFalsos = [
            "gooogle.com", "goggle.com", "faceboook.com", "faacebook.com",
            "youtubee.com", "youutube.com", "tiktokko.com", "ttiktok.com", 
            "tiiktok.com", "instagraam.com", "whattsapp.com", "whatsappp.com",
            "m-pesaa.co.mz", "mpesaa.co.mz", "vodacoom.co.mz", "vodacom.co.moz",
            "e-mollaa.co.mz", "emolaa.co.mz", "biim.co.mz", "bciii.co.mz",
            "twitterr.com", "linkedinn.com"
        ];

        const éDominioFalso = dominiosFalsos.some(site => urlLower.includes(site));
        if (éDominioFalso) {
            resultadoDiv.innerHTML = `
                <div class="resultado-box perigoso">
                    ⚠️ GOLPE DETECTADO!<br>
                    <span style="font-size: 14px; font-weight: 400;">Este site tenta imitar um site oficial. Não clique!</span>
                </div>
            `;
            return;
        }

        // 2. LISTA DE SITES OFICIAIS SEGUROS
        const sitesSeguros = [
            "m-pesa.co.mz", "mpesa.co.mz", "vodacom.co.mz", 
            "movitel.co.mz", "e-mola.co.mz", "bim.co.mz", 
            "bci.co.mz", "millenniumbim.co.mz", "google.com", 
            "facebook.com", "whatsapp.com", "instagram.com",
            "tiktok.com", "youtube.com", "twitter.com", "x.com",
            "linkedin.com", "wikipedia.org"
        ];

        const éSiteSeguro = sitesSeguros.some(site => urlLower.includes(site));
        if (éSiteSeguro) {
            resultadoDiv.innerHTML = `
                <div class="resultado-box seguro">
                    ✅ SITE OFICIAL SEGURO!<br>
                    <span style="font-size: 14px; font-weight: 400;">Este é o site oficial. Pode confiar.</span>
                </div>
            `;
            return;
        }

        // 3. LISTA DE PALAVRAS PERIGOSAS
        const termosPerigosos = [
            "ganhar-dinheiro", "premio", "sorteio", "gratis", "vaga-urgente", 
            "atualizar-senha", "bit.ly", "login", "verificar", "senha", 
            "banco", "pix", "urgente", "conta", "recuperar", "ganhador",
            "mpesa", "m-pesa", "vodacom", "e-mola", "tiktok", "facebook",
            "whatsapp", "instagram", "ganhar-iphone", "ganhar-moto",
            "ajuda-financeira", "doacao", "parabens"
        ];

        const éPerigoso = termosPerigosos.some(termo => urlLower.includes(termo));

        if (éPerigoso) {
            resultadoDiv.innerHTML = `
                <div class="resultado-box perigoso">
                    ⚠️ LINK PERIGOSO DETECTADO!<br>
                    <span style="font-size: 14px; font-weight: 400;">Este link contém padrões comuns de golpes. Não clique!</span>
                </div>
            `;
        } else {
            resultadoDiv.innerHTML = `
                <div class="resultado-box seguro">
                    ✅ LINK SEGURO!<br>
                    <span style="font-size: 14px; font-weight: 400;">Nenhuma ameaça foi encontrada.</span>
                </div>
            `;
        }
    }
    </script>

</body>
</html>
